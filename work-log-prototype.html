const FONT_SANS = "'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif";

const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];
const DAY_MINUTES = 1440;
const BAR_HEIGHT = 620;
const BAR_WIDTH = 210;
const PX_PER_MIN = BAR_HEIGHT / DAY_MINUTES;

/* ---------- date helpers ---------- */
const pad = (n) => String(n).padStart(2, "0");
const formatDateKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDateKey = (s) => {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
};
const formatDateJP = (s) => {
  const d = parseDateKey(s);
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${WEEKDAYS[d.getDay()]}）`;
};
const addDays = (s, delta) => {
  const d = parseDateKey(s);
  d.setDate(d.getDate() + delta);
  return formatDateKey(d);
};
const todayKey = () => formatDateKey(new Date());
const monthKeyFromDateKey = (dateKey) => dateKey.slice(0, 7);
const currentMonthKey = () => monthKeyFromDateKey(todayKey());
const formatMonthJP = (monthKey) => {
  const [y, m] = monthKey.split("-").map(Number);
  return `${y}年${m}月`;
};
const addMonths = (monthKey, delta) => {
  let [y, m] = monthKey.split("-").map(Number);
  m += delta;
  while (m > 12) {
    m -= 12;
    y += 1;
  }
  while (m < 1) {
    m += 12;
    y -= 1;
  }
  return `${y}-${pad(m)}`;
};
const daysInMonth = (monthKey) => {
  const [y, m] = monthKey.split("-").map(Number);
  return new Date(y, m, 0).getDate();
};
const firstWeekdayOfMonth = (monthKey) => {
  const [y, m] = monthKey.split("-").map(Number);
  return new Date(y, m - 1, 1).getDay();
};
const dateKeyForDay = (monthKey, day) => `${monthKey}-${pad(day)}`;
const minutesToLabel = (m) => `${pad(Math.floor(m / 60))}:${pad(Math.round(m % 60))}`;
const formatDuration = (totalMinutes) => {
  const m = Math.round(totalMinutes);
  const h = Math.floor(m / 60);
  const rem = m % 60;
  if (h === 0) return `${rem}分`;
  if (rem === 0) return `${h}時間`;
  return `${h}時間${rem}分`;
};
const timeToMinutes = (t) => {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
};
const nowMinutes = () => {
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
};

/* ---------- storage helpers (browser localStorage) ---------- */
function loadDay(dateKey) {
  try {
    const raw = localStorage.getItem(`worklog:day:${dateKey}`);
    if (raw) return JSON.parse(raw);
  } catch (e) {
    /* key not found or storage error — start fresh */
  }
  return { planned: [], actual: [], mood: null };
}
function saveDay(dateKey, data) {
  try {
    localStorage.setItem(`worklog:day:${dateKey}`, JSON.stringify(data));
  } catch (e) {
    console.error("save failed", e);
  }
}
function loadSettings() {
  try {
    const raw = localStorage.getItem("worklog:pomodoro-settings");
    if (raw) return JSON.parse(raw);
  } catch (e) {
    /* defaults */
  }
  return { workMin: 25, breakMin: 5, autoLog: true };
}
function saveSettings(settings) {
  try {
    localStorage.setItem("worklog:pomodoro-settings", JSON.stringify(settings));
  } catch (e) {
    console.error("save failed", e);
  }
}

/* ---------- small UI atoms ---------- */
function Legend({ color, softColor, label, textColor }) {
  return (
    <span className="inline-flex items-center gap-2 text-sm" style={{ color: textColor || COLORS.inkSoft }}>

/* ---------- timeline bar ---------- */
function TimelineBar({ label, color, softColor, blocks, onDeleteBlock, onUpdateBlock, showNowLine }) {
  const [editingId, setEditingId] = useState(null);
  const [draftLabel, setDraftLabel] = useState("");
  const [draftStart, setDraftStart] = useState("");
  const [draftEnd, setDraftEnd] = useState("");
  const [draftError, setDraftError] = useState("");
  const [drag, setDrag] = useState(null); // { id, startY, origStart, duration, deltaMin, moved }
  const [nowMin, setNowMin] = useState(() => nowMinutes());

  useEffect(() => {
    if (!showNowLine) return;
    const id = setInterval(() => setNowMin(nowMinutes()), 60000);
    return () => clearInterval(id);
  }, [showNowLine]);

  const SNAP = 5; // minutes

  const snapStart = (rawStart, duration) => {
    let s = Math.round(rawStart / SNAP) * SNAP;
    s = Math.max(0, Math.min(DAY_MINUTES - duration, s));
    return s;
  };

  const hourMarks = [];
  for (let h = 0; h <= 24; h += 3) hourMarks.push(h);

  return (
    <div className="flex flex-col items-center" style={{ fontFamily: FONT_SANS }}>
      <div className="mb-3" style={{ color: COLORS.ink, fontWeight: 700, fontSize: 20 }}>{label}</div>
      <div className="relative" style={{ width: BAR_WIDTH, height: BAR_HEIGHT }}>
        {hourMarks.map((h) => (
          <div key={h} style={{ position: "absolute", top: h * 60 * PX_PER_MIN, left: -38, width: 34, textAlign: "right", fontSize: 12, color: COLORS.ink, fontFamily: FONT_MONO, fontWeight: 600, transform: "translateY(-6px)" }}>
            {pad(h === 24 ? 24 : h)}:00
          </div>
        ))}
        <div
          className="relative"
          style={{
            width: BAR_WIDTH,
            height: BAR_HEIGHT,
            background: COLORS.panel,
            border: `2px solid ${COLORS.panelBorder}`,
            borderRadius: RADIUS,
            boxSizing: "border-box",
            overflow: "hidden",
          }}
        >
          {hourMarks.map((h) => (
            <div
              key={h}
              style={{
                position: "absolute",
                top: h * 60 * PX_PER_MIN,
                left: 0,
                right: 0,
                borderTop: `1px ${h % 12 === 0 ? "solid" : "dashed"} ${h % 12 === 0 ? COLORS.lineStrong : COLORS.line}`,
              }}
            />
          ))}
          {showNowLine && (
            <div
              style={{
                position: "absolute",
                top: nowMin * PX_PER_MIN,
                left: -4,
                right: -4,
                borderTop: `2px solid ${COLORS.actual}`,
              }}
            />
          )}
          {blocks.map((b) => {
            const duration = b.end - b.start;
            const isDraggingThis = drag && drag.id === b.id;
            const displayStart = isDraggingThis ? snapStart(drag.origStart + drag.deltaMin, duration) : b.start;
            const top = displayStart * PX_PER_MIN;
            const height = Math.max(2, duration * PX_PER_MIN);
            const isEditing = editingId === b.id;
            const startEdit = () => {
              setEditingId(b.id);
              setDraftLabel(b.label);
              setDraftStart(minutesToLabel(b.start));
              setDraftEnd(minutesToLabel(b.end));
              setDraftError("");
            };
            const cancelEdit = () => {
              setEditingId(null);
              setDraftError("");
            };
            const commitEdit = () => {
              const s = timeToMinutes(draftStart);
              const en = timeToMinutes(draftEnd);
              if (en <= s) {
                setDraftError("終了は開始より後にしてください");
                return;
              }
              onUpdateBlock(b.id, { label: draftLabel.trim() || b.label, start: s, end: en });
              setEditingId(null);
              setDraftError("");
            };
            const handlePointerDown = (e) => {
              if (isEditing) return;
              e.currentTarget.setPointerCapture(e.pointerId);
              setDrag({ id: b.id, startY: e.clientY, origStart: b.start, duration, deltaMin: 0, moved: false });
            };
            const handlePointerMove = (e) => {
              if (!drag || drag.id !== b.id) return;
              const deltaY = e.clientY - drag.startY;
              const deltaMin = deltaY / PX_PER_MIN;
              const moved = drag.moved || Math.abs(deltaY) > 4;
              setDrag((prev) => (prev && prev.id === b.id ? { ...prev, deltaMin, moved } : prev));
            };
            const handlePointerUp = () => {
              if (!drag || drag.id !== b.id) return;
              if (drag.moved) {
                const newStart = snapStart(drag.origStart + drag.deltaMin, duration);
                onUpdateBlock(b.id, { start: newStart, end: newStart + duration });
              } else {
                startEdit();
              }
              setDrag(null);
            };
            const onFieldKeyDown = (e) => {
              e.stopPropagation();
              if (e.key === "Enter") commitEdit();
              if (e.key === "Escape") cancelEdit();
            };
            return (
              <div
                key={b.id}
                className="group"
                onPointerDown={handlePointerDown}
                onPointerMove={handlePointerMove}
                onPointerUp={handlePointerUp}
                style={{
                  position: "absolute",
                  top,
                  height: isEditing ? "auto" : height,
                  minHeight: isEditing ? 118 : height,
                  left: 0,
                  right: 0,
                  background: color,
                  border: `1px solid ${COLORS.ink}`,
                  borderLeftWidth: 3,
                  display: "flex",
                  alignItems: "center",
                  overflow: isEditing ? "visible" : "hidden",
                  cursor: isEditing ? "default" : isDraggingThis ? "grabbing" : "grab",
                  touchAction: "none",
                  boxShadow: isDraggingThis || isEditing ? "0 4px 10px rgba(0,0,0,0.35)" : "none",
                  zIndex: isEditing ? 10 : isDraggingThis ? 5 : 1,
                }}
                title={isEditing ? undefined : `${b.label} (${minutesToLabel(displayStart)}–${minutesToLabel(displayStart + duration)}) ドラッグで移動・クリックで編集`}
              >
                {isEditing ? (
                  <div
                    onPointerDown={(e) => e.stopPropagation()}
                    style={{
                      width: "100%",
                      background: "#fff",
                      border: `1px solid ${COLORS.ink}`,
                      padding: 6,
                      boxSizing: "border-box",
                      display: "flex",
                      flexDirection: "column",
                      gap: 5,
                    }}
                  >
                    <input
                      autoFocus
                      value={draftLabel}
                      onChange={(e) => setDraftLabel(e.target.value)}
                      onKeyDown={onFieldKeyDown}
                      placeholder="内容"
                      style={{
                        border: `1px solid ${COLORS.lineStrong}`,
                        color: COLORS.ink,
                        fontSize: 12,
                        fontFamily: FONT_SANS,
                        padding: "3px 6px",
                        boxSizing: "border-box",
                      }}
                    />
                    <div className="flex items-center gap-1">
                      <input
                        type="time"
                        value={draftStart}
                        onChange={(e) => setDraftStart(e.target.value)}
                        onKeyDown={onFieldKeyDown}
                        style={{ border: `1px solid ${COLORS.lineStrong}`, fontSize: 11, fontFamily: FONT_MONO, padding: "2px 4px", width: "50%", boxSizing: "border-box" }}
                      />
                      <span style={{ fontSize: 11, color: COLORS.inkSoft }}>〜</span>
                      <input
                        type="time"
                        value={draftEnd}
                        onChange={(e) => setDraftEnd(e.target.value)}
                        onKeyDown={onFieldKeyDown}
                        style={{ border: `1px solid ${COLORS.lineStrong}`, fontSize: 11, fontFamily: FONT_MONO, padding: "2px 4px", width: "50%", boxSizing: "border-box" }}
                      />
                    </div>
                    {draftError && (
                      <div style={{ fontSize: 10, color: COLORS.actual }}>{draftError}</div>
                    )}
                    <div className="flex justify-end gap-2">
                      <button
                        onClick={cancelEdit}
                        style={{ fontSize: 11, color: COLORS.inkSoft, background: "none", border: "none", cursor: "pointer", textDecoration: "underline" }}
                      >
                        キャンセル
                      </button>
                      <button
                        onClick={commitEdit}
                        style={{ fontSize: 11, color: "#fff", background: COLORS.ink, border: "none", padding: "3px 8px", cursor: "pointer" }}
                      >
                        確定
                      </button>
                    </div>
                  </div>
                ) : (
                  <span
                    style={{
                      color: "#fff",
                      fontSize: 12,
                      lineHeight: 1.2,
                      padding: "0 8px",
                      whiteSpace: height < 30 ? "nowrap" : "normal",
                      overflow: "hidden",
                      textOverflow: "ellipsis",
                      display: height < 30 ? "block" : "-webkit-box",
                      WebkitLineClamp: 2,
                      WebkitBoxOrient: "vertical",
                      pointerEvents: "none",
                    }}
                  >
                    {b.label || "(無題)"}
                  </span>
                )}
                {!isEditing && (
                  <button
                    className="opacity-0 group-hover:opacity-100"
                    onPointerDown={(e) => e.stopPropagation()}
                    onClick={(e) => {
                      e.stopPropagation();
                      onDeleteBlock(b.id);
                    }}
                    style={{
                      position: "absolute",
                      top: 0,
                      right: 0,
                      width: 16,
                      height: 16,
                      lineHeight: "14px",
                      fontSize: 11,
                      background: COLORS.ink,
                      color: "#fff",
                      border: "none",
                      cursor: "pointer",
                    }}
                  >
                    ×
                  </button>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ---------- pomodoro ---------- */
function PomodoroPanel({ settings, onSettingsChange, onWorkComplete }) {
  const { workMin, breakMin, autoLog } = settings;
  const [mode, setMode] = useState("work");
  const [running, setRunning] = useState(false);
  const [phaseEndAt, setPhaseEndAt] = useState(null);
  const [pausedRemaining, setPausedRemaining] = useState(workMin * 60);
  const [sessions, setSessions] = useState(0);
  const [tick, setTick] = useState(0);
  const [taskLabel, setTaskLabel] = useState("");
  const audioRef = useRef(null);

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => setTick((t) => t + 1), 1000);
    return () => clearInterval(id);
  }, [running]);

  const secondsLeft = running && phaseEndAt ? Math.max(0, Math.round((phaseEndAt - Date.now()) / 1000)) : pausedRemaining;

  const playCompleteSound = () => {
    try {
      if (!audioRef.current) {
        audioRef.current = new Audio(COMPLETE_SOUND_SRC);
      }
      audioRef.current.currentTime = 0;
      audioRef.current.play().catch(() => {
        /* playback blocked, e.g. before any user gesture */
      });
    } catch (e) {
      /* audio not available */
    }
  };

  useEffect(() => {
    if (!running || !phaseEndAt) return;
    if (Date.now() < phaseEndAt) return;
    playCompleteSound();
    if (mode === "work") {
      const endTs = Date.now();
      const startTs = endTs - workMin * 60000;
      if (autoLog) {
        onWorkComplete({ label: taskLabel.trim() || "ポモドーロ作業", startTs, endTs });
      }
      setSessions((s) => s + 1);
      setMode("break");
      setPhaseEndAt(Date.now() + breakMin * 60000);
    } else {
      setMode("work");
      setPhaseEndAt(Date.now() + workMin * 60000);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [tick]);

  const start = () => {
    const remain = running ? secondsLeft : pausedRemaining;
    setPhaseEndAt(Date.now() + remain * 1000);
    setRunning(true);
    // unlock audio playback within this user gesture so the later
    // automatic play() on phase completion is not blocked by the browser
    try {
      if (!audioRef.current) audioRef.current = new Audio(COMPLETE_SOUND_SRC);
      audioRef.current.volume = 0;
      audioRef.current
        .play()
        .then(() => {
          audioRef.current.pause();
          audioRef.current.currentTime = 0;
          audioRef.current.volume = 1;
        })
        .catch(() => {
          audioRef.current.volume = 1;
        });
    } catch (e) {
      /* audio not available */
    }
  };
  const pause = () => {
    setPausedRemaining(secondsLeft);
    setPhaseEndAt(null);
    setRunning(false);
  };
  const stop = () => {
    if (mode === "work") {
      const elapsedSeconds = Math.max(0, workMin * 60 - secondsLeft);
      if (elapsedSeconds > 0) {
        const endTs = Date.now();
        const startTs = endTs - elapsedSeconds * 1000;
        onWorkComplete({ label: taskLabel.trim() || "ポモドーロ作業", startTs, endTs });
      }
    }
    setRunning(false);
    setPhaseEndAt(null);
    setMode("work");
    setPausedRemaining(workMin * 60);
  };
  const reset = () => {
    setRunning(false);
    setPhaseEndAt(null);
    setMode("work");
    setPausedRemaining(workMin * 60);
    setSessions(0);
  };

  const updateWorkMin = (v) => {
    const next = { ...settings, workMin: v };
    onSettingsChange(next);
    if (!running && mode === "work") setPausedRemaining(v * 60);
  };
  const updateBreakMin = (v) => {
    const next = { ...settings, breakMin: v };
    onSettingsChange(next);
    if (!running && mode === "break") setPausedRemaining(v * 60);
  };

  const modeColor = mode === "work" ? COLORS.work : COLORS.rest;

  return (
    <div
      style={{
        border: `2px solid ${COLORS.panelBorder}`,
        borderLeft: `6px solid ${modeColor}`,
        borderRadius: RADIUS,
        background: COLORS.panel,
        padding: "12px 16px",
        fontFamily: FONT_SANS,
        boxSizing: "border-box",
      }}
    >
      <div className="flex items-center justify-between mb-2">
        <span style={{ fontSize: 13, fontWeight: 700, color: modeColor }}>{mode === "work" ? "作業中" : "休憩中"}</span>
        <span style={{ fontSize: 12, color: COLORS.inkSoft }}>完了 {sessions} 回</span>
      </div>
      <div className="mb-2">
        <label style={{ fontSize: 11, color: COLORS.inkSoft, display: "block", marginBottom: 3 }}>今何をしていますか？</label>
        <input
          value={taskLabel}
          onChange={(e) => setTaskLabel(e.target.value)}
          placeholder="例：エモクロアシナリオ執筆"
          style={{ width: "100%", border: `1px solid ${COLORS.lineStrong}`, borderRadius: 8, padding: "5px 8px", fontSize: 13, background: "#fff", color: COLORS.ink, boxSizing: "border-box" }}
        />
      </div>
      <div className="text-center" style={{ fontFamily: FONT_MONO, fontSize: 40, fontWeight: 700, color: COLORS.ink, letterSpacing: 1, lineHeight: 1.1 }}>
        {pad(Math.floor(secondsLeft / 60))}:{pad(secondsLeft % 60)}
      </div>
      <div className="flex justify-center gap-2 mt-2 mb-1">
        {!running ? (
          <IconButton onClick={start} style={{ background: COLORS.ink, color: "#fff", borderColor: COLORS.ink }}>開始</IconButton>
        ) : (
          <IconButton onClick={pause}>一時停止</IconButton>
        )}
        <IconButton onClick={stop} style={{ background: COLORS.actual, color: "#fff", borderColor: COLORS.actual }}>停止</IconButton>
        <IconButton onClick={reset}>リセット</IconButton>
      </div>
      {mode === "work" && (running || pausedRemaining < workMin * 60) && (
        <div className="text-center mb-2" style={{ fontSize: 11, color: COLORS.inkSoft }}>
          停止すると、ここまでの作業時間が実績に記録されます
        </div>
      )}
      <div className="flex flex-wrap gap-3 items-center text-xs" style={{ color: COLORS.inkSoft }}>
        <label className="flex items-center gap-1">
          作業
          <input
            type="number"
            min={1}
            max={180}
            value={workMin}
            onChange={(e) => updateWorkMin(Number(e.target.value) || 1)}
            style={{ width: 40, border: `1px solid ${COLORS.lineStrong}`, padding: "2px 4px", fontFamily: FONT_MONO }}
          />
          分
        </label>
        <label className="flex items-center gap-1">
          休憩
          <input
            type="number"
            min={1}
            max={60}
            value={breakMin}
            onChange={(e) => updateBreakMin(Number(e.target.value) || 1)}
            style={{ width: 40, border: `1px solid ${COLORS.lineStrong}`, padding: "2px 4px", fontFamily: FONT_MONO }}
          />
          分
        </label>
        <label className="flex items-center gap-1">
          <input type="checkbox" checked={autoLog} onChange={(e) => onSettingsChange({ ...settings, autoLog: e.target.checked })} />
          自動記録
        </label>
      </div>
    </div>
  );
}


/* ---------- month calendar ---------- */
function MonthCalendar({ monthKey, onSelectDay }) {
  const [dayData, setDayData] = useState({});
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    const n = daysInMonth(monthKey);
    const keys = Array.from({ length: n }, (_, i) => dateKeyForDay(monthKey, i + 1));
    Promise.all(
      keys.map((k) =>
        Promise.resolve(loadDay(k)).then((data) => {
          const mins = (data.actual || []).reduce((sum, b) => sum + (b.end - b.start), 0);
          return [k, { mins, mood: data.mood || null }];
        })
      )
    ).then((entries) => {
      if (cancelled) return;
      const map = {};
      entries.forEach(([k, v]) => {
        map[k] = v;
      });
      setDayData(map);
      setLoading(false);
    });
    return () => {
      cancelled = true;
    };
  }, [monthKey]);

  const n = daysInMonth(monthKey);
  const startWeekday = firstWeekdayOfMonth(monthKey);
  const today = todayKey();
  const monthTotal = Object.values(dayData).reduce((s, v) => s + v.mins, 0);

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= n; d++) cells.push(d);

  return (
    <div style={{ border: `2px solid ${COLORS.panelBorder}`, borderRadius: RADIUS, background: COLORS.panel, padding: 18 }}>
      <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.ink, marginBottom: 14 }}>
        {formatMonthJP(monthKey)}の実績合計: {loading ? "…" : formatDuration(monthTotal)}
      </div>
      {loading ? (
        <div style={{ fontSize: 13, color: COLORS.ink }}>読み込み中…</div>
      ) : (
        <div>
          <div className="grid grid-cols-7 gap-1 mb-1">
            {WEEKDAYS.map((w, i) => (
              <div key={i} style={{ textAlign: "center", fontSize: 11, color: COLORS.inkSoft, fontWeight: 700 }}>
                {w}
              </div>
            ))}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {cells.map((d, idx) => {
              if (d === null) return <div key={idx} />;
              const key = dateKeyForDay(monthKey, d);
              const { mins = 0, mood = null } = dayData[key] || {};
              const isToday = key === today;
              return (
                <button
                  type="button"
                  key={idx}
                  onClick={() => onSelectDay(key)}
                  style={{
                    border: `1px solid ${isToday ? COLORS.actual : COLORS.lineStrong}`,
                    borderRadius: 8,
                    background: mins > 0 ? "#fff" : "transparent",
                    padding: "6px 2px",
                    cursor: "pointer",
                    textAlign: "center",
                    minHeight: 56,
                    display: "flex",
                    flexDirection: "column",
                    justifyContent: "center",
                    gap: 2,
                    boxSizing: "border-box",
                  }}
                >
                  <span style={{ fontSize: 12, fontWeight: isToday ? 700 : 400, color: COLORS.ink }}>
                    {d} {mood || ""}
                  </span>
                  <span style={{ fontSize: 10, fontFamily: FONT_MONO, color: mins > 0 ? COLORS.actual : COLORS.inkSoft }}>
                    {mins > 0 ? `${Math.floor(mins / 60)}:${pad(mins % 60)}` : "-"}
                  </span>
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- dropbox export (browser-only: uses OAuth2 PKCE + localStorage) ---------- */
const DBX_LS = {
  appKey: "worklog:dropbox:appkey",
  verifier: "worklog:dropbox:verifier",
  accessToken: "worklog:dropbox:access_token",
  refreshToken: "worklog:dropbox:refresh_token",
  expiresAt: "worklog:dropbox:expires_at",
  autoOn: "worklog:dropbox:auto_on",
  autoHours: "worklog:dropbox:auto_hours",
  lastExport: "worklog:dropbox:last_export",
};

function base64UrlEncode(bytes) {
  let str = "";
  for (const b of bytes) str += String.fromCharCode(b);
  return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function sha256Bytes(str) {
  const enc = new TextEncoder().encode(str);
  const digest = await crypto.subtle.digest("SHA-256", enc);
  return new Uint8Array(digest);
}
function randomVerifier() {
  const arr = new Uint8Array(32);
  crypto.getRandomValues(arr);
  return base64UrlEncode(arr);
}
function currentRedirectUri() {
  return window.location.origin + window.location.pathname;
}

async function startDropboxAuth(appKey) {
  const verifier = randomVerifier();
  localStorage.setItem(DBX_LS.appKey, appKey);
  localStorage.setItem(DBX_LS.verifier, verifier);
  const challenge = base64UrlEncode(await sha256Bytes(verifier));
  const url =
    "https://www.dropbox.com/oauth2/authorize" +
    `?client_id=${encodeURIComponent(appKey)}` +
    "&response_type=code" +
    `&code_challenge=${challenge}` +
    "&code_challenge_method=S256" +
    `&redirect_uri=${encodeURIComponent(currentRedirectUri())}` +
    "&token_access_type=offline";
  window.location.href = url;
}

async function exchangeDropboxCode(code) {
  const appKey = localStorage.getItem(DBX_LS.appKey);
  const verifier = localStorage.getItem(DBX_LS.verifier);
  if (!appKey || !verifier) return { error: "missing_app_key_or_verifier" };
  const body = new URLSearchParams({
    code,
    grant_type: "authorization_code",
    client_id: appKey,
    redirect_uri: currentRedirectUri(),
    code_verifier: verifier,
  });
  const res = await fetch("https://api.dropboxapi.com/oauth2/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body,
  });
  const data = await res.json();
  if (data.access_token) {
    localStorage.setItem(DBX_LS.accessToken, data.access_token);
    localStorage.setItem(DBX_LS.refreshToken, data.refresh_token || "");
    localStorage.setItem(DBX_LS.expiresAt, String(Date.now() + data.expires_in * 1000));
  }
  return data;
}

async function ensureDropboxToken() {
  const appKey = localStorage.getItem(DBX_LS.appKey);
  const refreshToken = localStorage.getItem(DBX_LS.refreshToken);
  const expiresAt = Number(localStorage.getItem(DBX_LS.expiresAt) || 0);
  const accessToken = localStorage.getItem(DBX_LS.accessToken);
  if (accessToken && Date.now() < expiresAt - 60000) return accessToken;
  if (!appKey || !refreshToken) return null;
  const body = new URLSearchParams({ grant_type: "refresh_token", refresh_token: refreshToken, client_id: appKey });
  const res = await fetch("https://api.dropboxapi.com/oauth2/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body,
  });
  const data = await res.json();
  if (data.access_token) {
    localStorage.setItem(DBX_LS.accessToken, data.access_token);
    localStorage.setItem(DBX_LS.expiresAt, String(Date.now() + data.expires_in * 1000));
    return data.access_token;
  }
  return null;
}

function collectAllWorklogData() {
  const out = { exportedAt: new Date().toISOString(), settings: null, days: {} };
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key === "worklog:pomodoro-settings") {
      try {
        out.settings = JSON.parse(localStorage.getItem(key));
      } catch (e) {
        /* skip */
      }
    } else if (key && key.indexOf("worklog:day:") === 0) {
      const dateKey = key.slice("worklog:day:".length);
      try {
        out.days[dateKey] = JSON.parse(localStorage.getItem(key));
      } catch (e) {
        /* skip */
      }
    }
  }
  return out;
}

async function exportToDropboxNow() {
  const token = await ensureDropboxToken();
  if (!token) throw new Error("not_connected");
  const data = collectAllWorklogData();
  const json = JSON.stringify(data, null, 2);
  const now = new Date();
  const filename = `/しごとログ/export-${formatDateKey(now)}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.json`;
  const res = await fetch("https://content.dropboxapi.com/2/files/upload", {
    method: "POST",
    headers: {
      Authorization: `Bearer ${token}`,
      "Content-Type": "application/octet-stream",
      "Dropbox-API-Arg": JSON.stringify({ path: filename, mode: "add", autorename: true, mute: true }),
    },
    body: json,
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(text || `HTTP ${res.status}`);
  }
  localStorage.setItem(DBX_LS.lastExport, String(Date.now()));
  return res.json();
}

function DropboxPanel() {
  const isFileProtocol = window.location.protocol === "file:";
  const [appKeyInput, setAppKeyInput] = useState(() => localStorage.getItem(DBX_LS.appKey) || "");
  const [connected, setConnected] = useState(() => !!localStorage.getItem(DBX_LS.refreshToken));
  const [autoOn, setAutoOn] = useState(() => localStorage.getItem(DBX_LS.autoOn) === "1");
  const [autoHours, setAutoHours] = useState(() => Number(localStorage.getItem(DBX_LS.autoHours) || 3));
  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);
  const [lastExport, setLastExport] = useState(() => Number(localStorage.getItem(DBX_LS.lastExport) || 0));

  // handle the redirect back from Dropbox (?code=...)
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    if (!code) return;
    window.history.replaceState({}, document.title, window.location.pathname);
    setBusy(true);
    setStatus("Dropboxと連携しています…");
    exchangeDropboxCode(code).then((data) => {
      setBusy(false);
      if (data && data.access_token) {
        setConnected(true);
        setStatus("Dropboxと連携しました。");
      } else {
        setStatus("連携に失敗しました: " + (data && (data.error_description || data.error) ? data.error_description || data.error : "不明なエラー"));
      }
    });
  }, []);

  useEffect(() => {
    if (!autoOn || !connected) return;
    const id = setInterval(() => {
      exportToDropboxNow()
        .then(() => setLastExport(Date.now()))
        .catch((e) => setStatus("自動エクスポート失敗: " + e.message));
    }, autoHours * 60 * 60 * 1000);
    return () => clearInterval(id);
  }, [autoOn, autoHours, connected]);

  const handleConnect = () => {
    if (!appKeyInput.trim()) {
      setStatus("Dropboxアプリキーを入力してください");
      return;
    }
    startDropboxAuth(appKeyInput.trim());
  };
  const handleDisconnect = () => {
    [DBX_LS.accessToken, DBX_LS.refreshToken, DBX_LS.expiresAt].forEach((k) => localStorage.removeItem(k));
    setConnected(false);
    setStatus("連携を解除しました。");
  };
  const handleExportNow = () => {
    setBusy(true);
    setStatus("エクスポート中…");
    exportToDropboxNow()
      .then(() => {
        setLastExport(Date.now());
        setStatus("エクスポートしました。");
      })
      .catch((e) => setStatus("エクスポート失敗: " + e.message))
      .finally(() => setBusy(false));
  };
  const toggleAuto = (v) => {
    setAutoOn(v);
    localStorage.setItem(DBX_LS.autoOn, v ? "1" : "0");
  };
  const changeAutoHours = (v) => {
    setAutoHours(v);
    localStorage.setItem(DBX_LS.autoHours, String(v));
  };

  return (
    <div style={{ background: COLORS.panel, border: `2px solid ${COLORS.panelBorder}`, borderRadius: RADIUS, padding: 18 }}>
      <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10, color: COLORS.ink }}>Dropboxへの自動エクスポート</div>

      {isFileProtocol && (
        <div className="text-xs mb-3" style={{ color: COLORS.actual }}>
          このファイルを直接（file://）開いている状態では、Dropboxとの連携（認証のやり取り）は動作しません。
          この機能を使うには、このHTMLファイルを何らかのWebサーバー（例: GitHub Pages、Netlifyなど）にアップロードして
          http/https経由で開いてください。
        </div>
      )}

      {!connected ? (
        <div>
          <div className="text-xs mb-2" style={{ color: COLORS.inkSoft }}>
            事前に
            <a href="https://www.dropbox.com/developers/apps" target="_blank" rel="noreferrer" style={{ textDecoration: "underline" }}>
              Dropbox App Console
            </a>
            で自分用のアプリを作成し（Scoped App / files.content.write 権限）、「アプリキー」を発行してください。
            また、そのアプリの設定で「リダイレクトURI」に次のURLを追加してください:
          </div>
          <div
            style={{ fontFamily: FONT_MONO, fontSize: 11, background: "#fff", border: `1px solid ${COLORS.lineStrong}`, borderRadius: 6, padding: "4px 6px", marginBottom: 10, wordBreak: "break-all" }}
          >
            {currentRedirectUri()}
          </div>
          <div className="flex gap-2 items-center mb-2">
            <input
              value={appKeyInput}
              onChange={(e) => setAppKeyInput(e.target.value)}
              placeholder="Dropboxアプリキー"
              style={{ flex: 1, border: `1px solid ${COLORS.lineStrong}`, borderRadius: 8, padding: "6px 8px", fontSize: 13, background: "#fff" }}
            />
            <IconButton onClick={handleConnect} disabled={busy} style={{ background: COLORS.ink, color: "#fff", borderColor: COLORS.ink }}>
              Dropboxに接続
            </IconButton>
          </div>
        </div>
      ) : (
        <div>
          <div className="flex flex-wrap items-center gap-3 mb-2">
            <span style={{ fontSize: 12, color: COLORS.ink, fontWeight: 700 }}>接続済み</span>
            <IconButton onClick={handleExportNow} disabled={busy} style={{ background: COLORS.actual, color: "#fff", borderColor: COLORS.actual }}>
              今すぐエクスポート
            </IconButton>
            <IconButton onClick={handleDisconnect}>連携を解除</IconButton>
          </div>
          <div className="flex flex-wrap items-center gap-3 text-xs" style={{ color: COLORS.inkSoft }}>
            <label className="flex items-center gap-1">
              <input type="checkbox" checked={autoOn} onChange={(e) => toggleAuto(e.target.checked)} />
              自動エクスポートする（このページを開いている間のみ）
            </label>
            <label className="flex items-center gap-1">
              間隔:

                <option value={3}>3時間毎</option>
                <option value={6}>6時間毎</option>
                <option value={12}>12時間毎</option>
                <option value={24}>24時間毎</option>
              </select>
            </label>
            {lastExport > 0 && <span>最終エクスポート: {new Date(lastExport).toLocaleString("ja-JP")}</span>}
          </div>
        </div>
      )}
      {status && (
        <div className="text-xs mt-2" style={{ color: COLORS.ink }}>
          {status}
        </div>
      )}
    </div>
  );
}

/* ---------- backup export / import (browser-only: uses localStorage + File API) ---------- */
function downloadJSON(filename, dataObj) {
  const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function mergeBlockArrays(a, b) {
  const map = new Map();
  (a || []).forEach((x) => map.set(x.id, x));
  (b || []).forEach((x) => map.set(x.id, x));
  return Array.from(map.values());
}

function importWorklogData(data) {
  if (data.settings) {
    localStorage.setItem("worklog:pomodoro-settings", JSON.stringify(data.settings));
  }
  if (data.days) {
    Object.keys(data.days).forEach((dateKey) => {
      const existing = loadDay(dateKey);
      const incoming = data.days[dateKey] || {};
      const merged = {
        planned: mergeBlockArrays(existing.planned, incoming.planned),
        actual: mergeBlockArrays(existing.actual, incoming.actual),
        mood: incoming.mood != null ? incoming.mood : existing.mood || null,
      };
      saveDay(dateKey, merged);
    });
  }
}

function BackupPanel() {
  const [status, setStatus] = useState("");
  const fileInputRef = useRef(null);

  const handleExport = () => {
    const data = collectAllWorklogData();
    downloadJSON(`worklog-backup-${formatDateKey(new Date())}.json`, data);
    setStatus("ファイルに書き出しました。");
  };

  const handleImportClick = () => {
    if (fileInputRef.current) fileInputRef.current.click();
  };

  const handleFileChange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        importWorklogData(data);
        setStatus("インポートしました。画面を再読み込みします…");
        setTimeout(() => window.location.reload(), 800);
      } catch (err) {
        setStatus("読み込みに失敗しました: ファイルの形式が正しくない可能性があります。");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div style={{ background: COLORS.panel, border: `2px solid ${COLORS.panelBorder}`, borderRadius: RADIUS, padding: 18 }}>
      <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10, color: COLORS.ink }}>データのバックアップ・移行</div>
      <div className="text-xs mb-3" style={{ color: COLORS.inkSoft }}>
        別のブラウザ・端末・URL（例: ローカルのファイルとGitHub Pages版）の間でデータを移したいときは、
        移行元で「ファイルに書き出す」→ 移行先で「ファイルから読み込む」の順に使ってください。
        読み込みは既存の記録に追加でマージされます（上書き消去はされません）。
      </div>
      <div className="flex flex-wrap gap-2 items-center">
        <IconButton onClick={handleExport} style={{ background: COLORS.ink, color: "#fff", borderColor: COLORS.ink }}>
          ファイルに書き出す
        </IconButton>
        <IconButton onClick={handleImportClick}>ファイルから読み込む</IconButton>
        <input ref={fileInputRef} type="file" accept="application/json" onChange={handleFileChange} style={{ display: "none" }} />
      </div>
      {status && (
        <div className="text-xs mt-2" style={{ color: COLORS.ink }}>
          {status}
        </div>
      )}
    </div>
  );
}

function WorkLogApp() {
  const [dateKey, setDateKey] = useState(todayKey());
  const [viewMode, setViewMode] = useState("day"); // "day" | "month" | "settings"
  const [monthKey, setMonthKey] = useState(currentMonthKey());
  const [planned, setPlanned] = useState([]);
  const [actual, setActual] = useState([]);
  const [mood, setMood] = useState(null);
  const [loading, setLoading] = useState(true);
  const [settings, setSettings] = useState({ workMin: 25, breakMin: 5, autoLog: true });
  const [confirmClear, setConfirmClear] = useState(false);
  const [liveTracking, setLiveTracking] = useState(false);
  const [liveStartTs, setLiveStartTs] = useState(null);
  const [liveTick, setLiveTick] = useState(0);
  const idCounter = useRef(1);
  const nextId = () => `b${Date.now()}_${idCounter.current++}`;

  const isToday = dateKey === todayKey();

  useEffect(() => {
    setLoading(true);
    const data = loadDay(dateKey);
    setPlanned(data.planned || []);
    setActual(data.actual || []);
    setMood(data.mood || null);
    setLoading(false);
  }, [dateKey]);

  useEffect(() => {
    setSettings(loadSettings());
  }, []);

  useEffect(() => {
    if (loading) return;
    saveDay(dateKey, { planned, actual, mood });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [planned, actual, mood]);

  useEffect(() => {
    saveSettings(settings);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [settings]);

  useEffect(() => {
    if (!liveTracking) return;
    const id = setInterval(() => setLiveTick((t) => t + 1), 1000);
    return () => clearInterval(id);
  }, [liveTracking]);

  const addBlock = useCallback((target, block) => {
    const withId = { ...block, id: nextId() };
    if (target === "planned") setPlanned((p) => [...p, withId]);
    else setActual((a) => [...a, withId]);
  }, []);

  // records a real-world time span into the actual timeline, splitting it
  // across the midnight boundary (and writing to the correct day's storage)
  // so a session that crosses midnight never produces a negative duration
  const logActualSpan = useCallback(
    (label, startTs, endTs) => {
      let curStart = startTs;
      while (curStart < endTs) {
        const curStartDate = new Date(curStart);
        const dayEndTs = new Date(curStartDate.getFullYear(), curStartDate.getMonth(), curStartDate.getDate() + 1, 0, 0, 0, 0).getTime();
        const segEndTs = Math.min(endTs, dayEndTs);
        const key = formatDateKey(curStartDate);
        const startMin = curStartDate.getHours() * 60 + curStartDate.getMinutes();
        const elapsedMin = Math.max(1, Math.round((segEndTs - curStart) / 60000));
        const endMin = Math.min(DAY_MINUTES, startMin + elapsedMin);
        const block = { id: nextId(), label, start: startMin, end: endMin };

        if (key === dateKey) {
          setActual((a) => [...a, block]);
        } else {
          Promise.resolve(loadDay(key)).then((data) => {
            saveDay(key, { planned: data.planned || [], actual: [...(data.actual || []), block] });
          });
        }
        curStart = segEndTs;
      }
    },
    [dateKey]
  );

  const deletePlanned = (id) => setPlanned((p) => p.filter((b) => b.id !== id));
  const deleteActual = (id) => setActual((a) => a.filter((b) => b.id !== id));
  const updatePlanned = (id, patch) => setPlanned((p) => p.map((b) => (b.id === id ? { ...b, ...patch } : b)));
  const updateActual = (id, patch) => setActual((a) => a.map((b) => (b.id === id ? { ...b, ...patch } : b)));

  const startLive = () => {
    setLiveStartTs(Date.now());
    setLiveTracking(true);
  };
  const stopLive = () => {
    if (liveStartTs) {
      logActualSpan("作業（記録タイマー）", liveStartTs, Date.now());
    }
    setLiveTracking(false);
    setLiveStartTs(null);
  };
  const liveElapsed = liveTracking && liveStartTs ? Math.floor((Date.now() - liveStartTs) / 1000) : 0;

  const clearDay = () => {
    setPlanned([]);
    setActual([]);
    setMood(null);
    setConfirmClear(false);
  };

  return (
    <div style={{ background: COLORS.bg, minHeight: "100%", padding: "28px 24px", fontFamily: FONT_SANS, color: COLORS.ink }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
      `}</style>

      <div className="max-w-6xl mx-auto">
        {/* header */}
        <div className="flex flex-wrap items-end justify-between gap-3 mb-8">
          <div>
            <div style={{ fontSize: 22, fontWeight: 900, letterSpacing: 1, color: COLORS.ink }}>しごとログ</div>
            <div style={{ fontSize: 12, color: COLORS.ink, opacity: 0.75 }}>計画と実績をタイムラインで記録する</div>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            {viewMode === "day" ? (
              <>
                <IconButton onClick={() => setDateKey((d) => addDays(d, -1))}>◀</IconButton>
                <div style={{ fontFamily: FONT_MONO, fontSize: 14, minWidth: 170, textAlign: "center", color: COLORS.ink, fontWeight: 600 }}>{formatDateJP(dateKey)}</div>
                <IconButton onClick={() => setDateKey((d) => addDays(d, 1))}>▶</IconButton>
                {!isToday && <IconButton onClick={() => setDateKey(todayKey())}>今日</IconButton>}
                <IconButton
                  onClick={() => {
                    setMonthKey(monthKeyFromDateKey(dateKey));
                    setViewMode("month");

                >
                  月間カレンダー
                </IconButton>

                <Legend color={COLORS.planned} softColor={COLORS.plannedSoft} label="計画" textColor={COLORS.ink} />
                <Legend color={COLORS.actual} softColor={COLORS.actualSoft} label="実績" textColor={COLORS.ink} />
                <span style={{ fontSize: 12, color: COLORS.ink, fontWeight: 700 }}>
                  実績合計: {formatDuration(actual.reduce((sum, b) => sum + (b.end - b.start), 0))}
                </span>
              </div>
              {!confirmClear ? (
                <button
                  onClick={() => setConfirmClear(true)}
                  style={{ fontSize: 12, color: COLORS.ink, opacity: 0.75, background: "none", border: "none", cursor: "pointer", textDecoration: "underline" }}
                >
                  この日の記録をクリア
                </button>
              ) : (
                <span className="text-xs" style={{ color: COLORS.ink, fontWeight: 700 }}>
                  本当に削除しますか？{" "}
                  <button onClick={clearDay} style={{ textDecoration: "underline", background: "none", border: "none", cursor: "pointer", color: COLORS.ink }}>
                    はい
                  </button>{" "}
                  /{" "}
                  <button onClick={() => setConfirmClear(false)} style={{ textDecoration: "underline", background: "none", border: "none", cursor: "pointer", color: COLORS.ink }}>
                    いいえ
                  </button>
                </span>
              )}
            </div>

            <div className="mb-4">
              <MoodPicker mood={mood} onChange={setMood} />
            </div>

            {/* three-column layout: 計画 / 実績 / ポモドーロ */}
            <div className="flex flex-wrap gap-10 justify-center mb-10" style={{ paddingLeft: 40 }}>
              <TimelineBar label="計画" color={COLORS.planned} softColor={COLORS.plannedSoft} blocks={planned} onDeleteBlock={deletePlanned} onUpdateBlock={updatePlanned} showNowLine={isToday} />
              <TimelineBar label="実績" color={COLORS.actual} softColor={COLORS.actualSoft} blocks={actual} onDeleteBlock={deleteActual} onUpdateBlock={updateActual} showNowLine={isToday} />
              <div style={{ width: 360, maxWidth: "100%", marginTop: 36 }}>
                <PomodoroPanel settings={settings} onSettingsChange={setSettings} onWorkComplete={(b) => logActualSpan(b.label, b.startTs, b.endTs)} />
              </div>
            </div>

            {/* quick actions */}
            <div className="flex flex-wrap gap-6">
              <div style={{ flex: "1 1 320px", background: COLORS.panel, border: `2px solid ${COLORS.panelBorder}`, borderRadius: RADIUS, padding: 18 }}>
                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10, color: COLORS.ink }}>実績を今すぐ記録</div>
                <div className="flex items-center gap-3">
                  {!liveTracking ? (
                    <IconButton onClick={startLive} disabled={!isToday} style={{ background: COLORS.actual, color: "#fff", borderColor: COLORS.actual }}>
                      ● 記録開始
                    </IconButton>
                  ) : (
                    <>
                      <IconButton onClick={stopLive} style={{ background: COLORS.ink, color: "#fff", borderColor: COLORS.ink }}>
                        ■ 記録終了
                      </IconButton>
                      <span style={{ fontFamily: FONT_MONO, fontSize: 14, color: COLORS.ink }}>
                        経過 {pad(Math.floor(liveElapsed / 60))}:{pad(liveElapsed % 60)}
                      </span>
                    </>
                  )}
                  {!isToday && <span className="text-xs" style={{ color: COLORS.inkSoft }}>今日の日付でのみ使えます</span>}
                </div>
              </div>

              <div style={{ flex: "2 1 480px", background: COLORS.panel, border: `2px solid ${COLORS.panelBorder}`, borderRadius: RADIUS, padding: 18 }}>
                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10, color: COLORS.ink }}>ブロックを追加</div>
                <AddBlockForm onAdd={addBlock} />
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<WorkLogApp />);
</script>
</body>
</html>
